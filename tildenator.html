<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Tildenator</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #7bc96f;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    background: linear-gradient(#8fd97c, #6dbb60);
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 4px black;
}
</style>
</head>
<body>

<div id="ui">Cleaned: 0</div>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const player = {
    x: 400,
    y: 300,
    speed: 3,
    facingX: 1,
    facingY: 0
};

let cleaned = 0;

const stains = [];

function randomColor() {
    const colors = [
        "#8B4513",
        "#4A4A4A",
        "#7A5230",
        "#AA4444",
        "#555555"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
}

function spawnStain() {

    stains.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 25 + Math.random() * 30,
        color: randomColor()
    });

}

setInterval(spawnStain, 2000);

for(let i = 0; i < 5; i++) {
    spawnStain();
}

function update() {

    let moveX = 0;
    let moveY = 0;

    if(keys["w"] || keys["arrowup"])
        moveY -= 1;

    if(keys["s"] || keys["arrowdown"])
        moveY += 1;

    if(keys["a"] || keys["arrowleft"])
        moveX -= 1;

    if(keys["d"] || keys["arrowright"])
        moveX += 1;

    if(moveX !== 0 || moveY !== 0)
    {
        const length = Math.sqrt(moveX * moveX + moveY * moveY);

        moveX /= length;
        moveY /= length;

        player.x += moveX * player.speed;
        player.y += moveY * player.speed;

        player.facingX = moveX;
        player.facingY = moveY;
    }

    player.x = Math.max(20, Math.min(canvas.width-20, player.x));
    player.y = Math.max(20, Math.min(canvas.height-20, player.y));

    const spraying = keys[" "];

    if(spraying) {

        for(let i = stains.length - 1; i >= 0; i--) {

            const stain = stains[i];

            const dx = stain.x - player.x;
            const dy = stain.y - player.y;

            const distance = Math.sqrt(dx*dx + dy*dy);

            const dot =
                dx * player.facingX +
                dy * player.facingY;

            if(distance < 70 && dot > 0) {

                stain.radius -= 0.6;

                if(stain.radius <= 5) {
                    stains.splice(i,1);
                    cleaned++;
                }
            }
        }
    }

    document.getElementById("ui").innerText =
        `Cleaned: ${cleaned}`;
}

function drawFloor() {

    const tile = 64;

    for(let y = -tile; y < canvas.height + tile; y += tile) {
        for(let x = -tile; x < canvas.width + tile; x += tile) {

            ctx.strokeStyle = "rgba(0,0,0,0.08)";
            ctx.stroke();
        }
    }
}

function drawPlayer() {

    const spraying = keys[" "];

    ctx.save();

    ctx.translate(player.x, player.y);

    // Shadow
    ctx.fillStyle = "#4fa3ff";

    ctx.beginPath();
    ctx.ellipse(0, 18, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = "#4da6ff";
    ctx.fillRect(-10, -5, 20, 20);

    // Head
    ctx.fillStyle = "#ffe0bd";
    ctx.beginPath();
    ctx.arc(0, -12, 10, 0, Math.PI * 2);
    ctx.fill();

    if (spraying) {

        const nozzleX = 0;
        const nozzleY = -5;

        const sprayLength = 60;

        // Main water stream
        ctx.strokeStyle = "#88ddff";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(nozzleX, nozzleY);
        ctx.lineTo(
            nozzleX + player.facingX * sprayLength,
            nozzleY + player.facingY * sprayLength
        );
        ctx.stroke();

        // Spray particles
        const perpX = -player.facingY;
        const perpY = player.facingX;

        for (let i = 0; i < 15; i++) {

            const distance = Math.random() * sprayLength;
            const spread = (Math.random() - 0.5) * 20;

            const x =
                nozzleX +
                player.facingX * distance +
                perpX * spread;

            const y =
                nozzleY +
                player.facingY * distance +
                perpY * spread;

            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#cceeff";
            ctx.fill();
        }
    }

    ctx.restore();
}

function drawStains() {

    stains.forEach(stain => {

        ctx.fillStyle = stain.color;

        ctx.beginPath();
        ctx.arc(stain.x, stain.y,
            stain.radius,
            0,
            Math.PI*2);

        ctx.fill();

        for(let i=0;i<5;i++) {

            ctx.beginPath();

            ctx.arc(
                stain.x + (Math.random()-0.5)*stain.radius,
                stain.y + (Math.random()-0.5)*stain.radius,
                stain.radius*0.2,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    });
}

function render() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawFloor();
    drawStains();
    drawPlayer();

}

function gameLoop() {

    update();
    render();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
