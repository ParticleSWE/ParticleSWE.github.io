<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Tildenator</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #7bc96f;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    background: linear-gradient(#8fd97c, #6dbb60);
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 4px black;
    user-select: none;
}
</style>
</head>
<body>

<div id="ui">Cleaned: 0</div>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

window.addEventListener("resize", resize);

const player = {
    x: 400,
    y: 300,
    speed: 2.5,
    facingX: 1,
    facingY: 0
};

let cleaned = 0;
let targetStain = null;
let isSpraying = false;

const stains = [];

function randomColor() {
    const colors = [
        "#8B4513",
        "#4A4A4A",
        "#7A5230",
        "#AA4444",
        "#555555"
    ];

    return colors[Math.floor(Math.random() * colors.length)];
}

function spawnStain() {

    stains.push({
        x: 50 + Math.random() * (canvas.width - 100),
        y: 50 + Math.random() * (canvas.height - 100),
        radius: 25 + Math.random() * 25,
        color: randomColor()
    });
}

for(let i = 0; i < 5; i++) {
    spawnStain();
}

setInterval(spawnStain, 2000);

canvas.addEventListener("pointerdown", (event) => {

    const rect = canvas.getBoundingClientRect();

    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    let closestStain = null;
    let closestDistance = Infinity;

    stains.forEach(stain => {

        const dx = stain.x - clickX;
        const dy = stain.y - clickY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if(distance <= stain.radius && distance < closestDistance) {
            closestDistance = distance;
            closestStain = stain;
        }

    });

    if(closestStain) {
        targetStain = closestStain;
    }
});

function update() {

    isSpraying = false;

    if(targetStain) {

        const dx = targetStain.x - player.x;
        const dy = targetStain.y - player.y;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if(distance > 50) {

            player.facingX = dx / distance;
            player.facingY = dy / distance;

            player.x += player.facingX * player.speed;
            player.y += player.facingY * player.speed;

        } else {

            isSpraying = true;

            targetStain.radius -= 0.4;

            if(targetStain.radius <= 5) {

                const index = stains.indexOf(targetStain);

                if(index !== -1) {
                    stains.splice(index, 1);
                }

                cleaned++;
                targetStain = null;
            }
        }
    }

    document.getElementById("ui").innerText =
        `Cleaned: ${cleaned}`;
}

function drawFloor() {

    const tile = 64;

    for(let y = -tile; y < canvas.height + tile; y += tile) {

        for(let x = -tile; x < canvas.width + tile; x += tile) {

            ctx.beginPath();

            ctx.moveTo(x, y + tile / 2);
            ctx.lineTo(x + tile / 2, y);
            ctx.lineTo(x + tile, y + tile / 2);
            ctx.lineTo(x + tile / 2, y + tile);

            ctx.closePath();

            ctx.fillStyle =
                ((x + y) / tile) % 2 === 0
                ? "#84cf73"
                : "#7ac76a";

            ctx.fill();

            ctx.strokeStyle = "rgba(0,0,0,0.05)";
            ctx.stroke();
        }
    }
}

function drawStains() {

    stains.forEach(stain => {

        if(stain === targetStain) {

            ctx.strokeStyle = "yellow";
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.arc(
                stain.x,
                stain.y,
                stain.radius + 10,
                0,
                Math.PI * 2
            );
            ctx.stroke();
        }

        ctx.fillStyle = stain.color;

        ctx.beginPath();
        ctx.arc(
            stain.x,
            stain.y,
            stain.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();

        for(let i = 0; i < 5; i++) {

            ctx.beginPath();

            ctx.arc(
                stain.x + (Math.random() - 0.5) * stain.radius,
                stain.y + (Math.random() - 0.5) * stain.radius,
                stain.radius * 0.2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    });
}

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(0, 18, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = "#4da6ff";
    ctx.fillRect(-10, -5, 20, 20);

    // Head
    ctx.fillStyle = "#ffe0bd";
    ctx.beginPath();
    ctx.arc(0, -12, 10, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(-3, -14, 1.5, 0, Math.PI * 2);
    ctx.arc(3, -14, 1.5, 0, Math.PI * 2);
    ctx.fill();

    if(isSpraying) {

        const nozzleX = 0;
        const nozzleY = -5;

        const sprayLength = 70;

        ctx.strokeStyle = "#88ddff";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(nozzleX, nozzleY);
        ctx.lineTo(
            nozzleX + player.facingX * sprayLength,
            nozzleY + player.facingY * sprayLength
        );
        ctx.stroke();

        const perpX = -player.facingY;
        const perpY = player.facingX;

        for(let i = 0; i < 20; i++) {

            const distance = Math.random() * sprayLength;
            const spread = (Math.random() - 0.5) * 20;

            const x =
                nozzleX +
                player.facingX * distance +
                perpX * spread;

            const y =
                nozzleY +
                player.facingY * distance +
                perpY * spread;

            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#cceeff";
            ctx.fill();
        }
    }

    ctx.restore();
}

function render() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawFloor();
    drawStains();
    drawPlayer();
}

function gameLoop() {

    update();
    render();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
